<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Fleet Rentals - Modern Car Rental & Booking Platform">
  <meta name="theme-color" content="#1347FF">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fleet Rentals">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fleet Rentals - Car Rental & Booking</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for Flutter Web
       Configure YOUR_GOOGLE_MAPS_API_KEY for production Google Maps in Google Cloud Console -->
  <script src="https://maps.googleapis.com/maps/api/js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f121d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #182245 0%, #0d111d 100%);
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }

    .brand-logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(19, 71, 255, 0.15);
      border-top-color: #194BFB;
      border-right-color: #1347FF;
      animation: spin 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    .brand-ring-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      border: 2px dashed rgba(25, 75, 251, 0.4);
      animation: spin-reverse 2s linear infinite;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      fill: #194BFB;
      filter: drop-shadow(0 0 12px rgba(25, 75, 251, 0.6));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 8px;
      font-family: 'EuropaBold', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #8E9BAE;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
    }

    .progress-bar-container {
      width: 160px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #1347FF, #3F75FE);
      border-radius: 8px;
      position: absolute;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes indeterminate {
      0% { left: -45%; width: 40%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <!-- Brand Loading Screen (removed when Flutter renders) -->
  <div id="loading-indicator">
    <div class="brand-logo-container">
      <div class="brand-ring"></div>
      <div class="brand-ring-inner"></div>
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
      </svg>
    </div>
    <div class="brand-title">Fleet Rentals</div>
    <div class="brand-subtitle">Executive Fleet & Car Rentals</div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    // Smoothly remove loader when Flutter view is mounted
    const observer = new MutationObserver((mutationsList, observer) => {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 400);
          observer.disconnect();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
